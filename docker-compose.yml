services:
  web:
    build: .
    container_name: webapps2026_web
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=webapps2026_db
      - POSTGRES_USER=webapps2026_user
      - POSTGRES_PASSWORD=webapps2026_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: webapps2026_db
    environment:
      - POSTGRES_DB=webapps2026_db
      - POSTGRES_USER=webapps2026_user
      - POSTGRES_PASSWORD=webapps2026_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: