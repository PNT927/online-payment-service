{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Create Administrator
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5">

        <h1 class="mb-2">Create Administrator</h1>

        <p class="text-light mb-4">
            Register a new administrator account.
        </p>

        <div class="card">
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Create Admin
                    </button>
                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
