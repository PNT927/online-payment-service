{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Send Payment
{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="mb-4">Send Payment</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Send Payment</button>
    </form>
</div>
{% endblock %}
