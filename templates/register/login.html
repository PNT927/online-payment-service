{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Login
{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="mb-4">Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ login_form|crispy }}
        <button type="submit" class="btn btn-success">Login</button>
    </form>
</div>
{% endblock %}
