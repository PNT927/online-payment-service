{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Register
{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto">
    <h1 class="mb-4">Register</h1>
    <form method="post">
        {% csrf_token %}
        {{ register_form|crispy }}
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
</div>
{% endblock %}
